# Syncs Grafana's admin credentials from AWS Secrets Manager into the k8s Secret
# infra/terraform/monitoring.tf's grafana.admin.existingSecret references. Username
# is fixed (not worth a separate Secrets Manager entry for "admin"); password is a
# Terraform-generated random_password (infra/terraform/secrets.tf), never in git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    template:
      data:
        admin-user: "admin"
  data:
    - secretKey: admin-password
      remoteRef:
        key: helpdesk/grafana-admin-password
