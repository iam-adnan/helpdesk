# Grafana's admin login, synced from AWS Secrets Manager by External Secrets Operator.
#
# The chart is configured with grafana.admin.existingSecret = "grafana-admin-credentials",
# userKey = "admin-user", passwordKey = "admin-password" (infra/terraform/monitoring.tf),
# so BOTH keys must be present or the pod fails with CreateContainerConfigError.
#
# The subtlety that broke this: `target.template.data` REPLACES the secret's contents
# rather than adding to them. Listing only admin-user there meant the fetched password
# was retrieved and then thrown away, producing a one-key secret that Grafana rejected.
# Anything the template should emit has to be written in the template, with fetched
# values referenced explicitly.
#
# The fetched value is bound to `adminPassword` (no hyphen) because the v2 template
# engine cannot resolve `.admin-password` — a hyphen parses as subtraction. The OUTPUT
# key is still admin-password, which is what the chart reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Username is fixed, not a secret — it never leaves this file.
        admin-user: "admin"
        admin-password: "{{ .adminPassword }}"
  data:
    - secretKey: adminPassword
      remoteRef:
        key: helpdesk/grafana-admin-password
