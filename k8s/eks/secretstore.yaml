# References the External Secrets Operator ServiceAccount (namespace external-secrets,
# name external-secrets) that infra/terraform/addons.tf's helm_release.external_secrets
# creates and irsa.tf's module.external_secrets_irsa binds to a scoped-down IAM role —
# read-only on exactly the helpdesk/* AWS Secrets Manager entries (infra/terraform/secrets.tf).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
