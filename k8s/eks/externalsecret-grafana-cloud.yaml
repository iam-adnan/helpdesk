# Grafana Cloud remote_write credentials for Prometheus.
#
# Prometheus (infra/terraform/monitoring.tf) references this Secret by name in its
# remoteWrite basicAuth block, so both keys must exist before the Prometheus pod can
# start pushing. Synced from AWS Secrets Manager (helpdesk/grafana-cloud-credentials),
# which stores them as a single JSON document.
#
# `property` pulls one field out of that JSON rather than dumping the whole document into
# the key — without it, `username` would contain the literal string
# {"username":"...","password":"..."} and Grafana Cloud would reject the auth.
#
# Note the ordering, which mirrors the Grafana admin secret: the Prometheus pod mounts
# this at startup, so if `kubectl apply -k k8s/eks/` has not run yet the pod sits
# retrying rather than failing outright, and starts cleanly once the secret appears.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-cloud-credentials
    creationPolicy: Owner
  data:
    # The numeric Prometheus instance ID, not an email address.
    - secretKey: username
      remoteRef:
        key: helpdesk/grafana-cloud-credentials
        property: username
    # An Access Policy token (glc_...) scoped metrics:write.
    - secretKey: password
      remoteRef:
        key: helpdesk/grafana-cloud-credentials
        property: password
