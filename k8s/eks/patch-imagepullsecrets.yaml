# OPTIONAL — pairs with externalsecret-dockerhub.yaml, only needed for private Docker
# Hub repos. Not applied by default (see kustomization.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      imagePullSecrets:
        - name: dockerhub-pull-secret
