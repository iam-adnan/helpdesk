# OPTIONAL — only needed if the helpdesk-backend/helpdesk-frontend Docker Hub repos
# are PRIVATE. Not included by default in kustomization.yaml: an imagePullSecrets
# reference to a Secret that doesn't exist can make pulls fail even for images that
# would otherwise pull anonymously just fine, so this and patch-imagepullsecrets.yaml
# are opt-in. To enable: uncomment both entries in kustomization.yaml's resources/
# patches lists.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dockerhub-pull-secret
  namespace: helpdesk
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: dockerhub-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"https://index.docker.io/v1/":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: helpdesk/dockerhub-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: helpdesk/dockerhub-credentials
        property: password
