# Recreates the `helpdesk-secret` Kubernetes Secret (same name/keys the backend/celery/
# slack-bot Deployments already reference via envFrom/secretRef in k8s/all-in-one.yaml —
# zero Deployment changes needed) sourced from AWS Secrets Manager instead of the
# plaintext value that used to be committed directly in the base manifest.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helpdesk-secret
  namespace: helpdesk
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: helpdesk-secret
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: helpdesk/django-secret-key
    - secretKey: CORS_ALLOWED_ORIGINS
      remoteRef:
        key: helpdesk/cors-allowed-origins
