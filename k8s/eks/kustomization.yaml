# No top-level `namespace:` transform here on purpose — every resource in this
# overlay (and in ../base) already declares its own `metadata.namespace` explicitly
# (helpdesk or monitoring). A top-level namespace transform would stamp ALL of them
# with one namespace, which would break the monitoring-namespace resources below.
# (The "monitoring" namespace itself is created by Terraform — infra/terraform/
# monitoring.tf's kubernetes_namespace.monitoring — not by this overlay; "helpdesk"
# is declared in ../base/all-in-one.yaml.)

resources:
  - ../base
  - ingress.yaml
  - secretstore.yaml
  - externalsecret-helpdesk.yaml
  - externalsecret-alertmanager-slack.yaml
  # Grafana Cloud remote_write credentials for Prometheus.
  - externalsecret-grafana-cloud.yaml
  # In-cluster Grafana is disabled (infra/terraform/variables.tf's grafana_cloud_enabled),
  # so its admin-credentials secret and its /grafana Ingress would both point at a
  # Service that no longer exists. Re-enable these two alongside grafana_cloud_enabled=false.
  # - externalsecret-grafana.yaml
  # - ingress-grafana.yaml
  # Uncomment for PRIVATE Docker Hub repos only (see externalsecret-dockerhub.yaml):
  # - externalsecret-dockerhub.yaml

patches:
  - path: patch-storageclass.yaml
  - path: patch-delete-resources.yaml
  # fsGroup so the distroless non-root user can write to the EBS-backed PVCs — without
  # it celery/slack-bot/backend die at startup opening Django's log file.
  - path: patch-fsgroup.yaml
  # Uncomment together with externalsecret-dockerhub.yaml above, for PRIVATE repos only:
  # - path: patch-imagepullsecrets.yaml

# NOTE: images are NOT rewritten here via Kustomize's `images:` transformer. The base
# manifest's BACKEND_IMAGE_PLACEHOLDER / FRONTEND_IMAGE_PLACEHOLDER tokens (confirmed
# against k8s/all-in-one.yaml: used by the backend/celery/slack-bot and frontend
# Deployments respectively) are substituted by the CI deploy job via `kubectl set image`
# after `kubectl apply -k .` — the same mechanism the old k3s deploy job already used,
# just retargeted from SSH+kubectl-over-SSH to OIDC-authenticated kubectl. See the
# "deploy" job in .github/workflows/cicd.yml.
