# Syncs the Slack webhook URL from AWS Secrets Manager into the k8s Secret
# infra/terraform/monitoring.tf's alertmanager.alertmanagerSpec.secrets mounts at
# /etc/alertmanager/secrets/alertmanager-slack-webhook/ — referenced by the
# Alertmanager config's slack_configs.api_url_file. Same underlying webhook the
# GitHub Actions pipeline already uses for deploy-result notifications, just a
# second delivery path (runtime failures instead of deploy events) into the same
# Slack channel.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack-webhook
    creationPolicy: Owner
  data:
    - secretKey: slack_url
      remoteRef:
        key: helpdesk/slack-webhook-url
