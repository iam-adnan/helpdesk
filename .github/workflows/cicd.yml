# ============================================================================
# Required GitHub repo configuration (Settings -> Secrets and variables -> Actions)
# ============================================================================
# Secrets (sensitive — set with `gh secret set NAME`):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   — Docker Hub push/pull (already configured)
#   SONAR_TOKEN, SONAR_PROJECT_KEY,
#   SONAR_ORGANIZATION                    — SonarCloud (already configured)
#   EMAIL_USERNAME, EMAIL_PASSWORD,
#   NOTIFY_EMAIL                          — deploy-result email (already configured)
#   AWS_DEPLOY_ROLE_ARN                   — IAM role GitHub assumes via OIDC to deploy
#                                            to EKS. The `github_deploy_role_arn` output
#                                            of the MAIN stack (infra/terraform), printed
#                                            by infra/scripts/deploy.sh.
#   AWS_INFRA_ROLE_ARN                    — IAM role for .github/workflows/infra.yml
#                                            (terraform apply/destroy). The
#                                            `github_infra_role_arn` output of the
#                                            BOOTSTRAP stack, printed by
#                                            infra/scripts/bootstrap.sh. Note this comes
#                                            from bootstrap, not the main stack — a
#                                            CI-run destroy must not be able to delete
#                                            the role that is running it.
#   SLACK_WEBHOOK_URL                     — Slack Incoming Webhook for pipeline/deploy
#                                            notifications.
#
# Variables (non-sensitive — set with `gh variable set NAME`):
#   AWS_REGION           — e.g. "us-east-1"
#   EKS_CLUSTER_NAME      — e.g. "helpdesk-eks" (infra/terraform/variables.tf's cluster_name)
#   EKS_DEPLOY_ENABLED    — must be literally "true" to let the deploy/health-check/notify
#                            tail actually run. Left unset/false until the new AWS account
#                            + `terraform apply` (infra/terraform/) have actually happened —
#                            until then this job intentionally no-ops instead of failing.
#
# No longer used by this workflow (the k3s-on-EC2 deploy path was replaced by EKS):
#   EC2_HOST, EC2_SSH_KEY — safe to remove from repo secrets whenever convenient.
# ============================================================================

name: Mindstorm Helpdesk CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/helpdesk-backend
  DOCKER_FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/helpdesk-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================
  # JOB 1: Unit Tests
  # ============================================
  test-backend:
    name: "🧪 Backend Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          cd backend
          mkdir -p data
          touch data/helpdesk.log
          export DATABASE_PATH=data/test.sqlite3
          export DJANGO_SETTINGS_MODULE=helpdesk.settings
          export SECRET_KEY=test-secret-key
          export CELERY_BROKER_URL=redis://localhost:6379/0
          export CELERY_TASK_ALWAYS_EAGER=True
          pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  test-frontend:
    name: "🧪 Frontend Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint check
        run: |
          cd frontend
          npx next lint --quiet 2>/dev/null || echo "Lint completed"

      - name: Run tests with coverage
        run: |
          cd frontend
          npm test -- --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

      - name: Build check
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

  # ============================================
  # JOB 2: SonarQube Analysis (SonarCloud)
  # ============================================
  sonar-analysis:
    name: "🔍 SonarCloud Analysis"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v5
        with:
          name: backend-coverage
          path: backend/
        continue-on-error: true

      - name: Download frontend coverage
        uses: actions/download-artifact@v5
        with:
          name: frontend-coverage
          path: frontend/coverage/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=backend,frontend/src
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/__pycache__/**,**/migrations/**
        continue-on-error: true

  # ============================================
  # JOB 3: Trivy Source Scan
  # ============================================
  trivy-source-scan:
    name: "🛡️ Trivy Source Scan"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Run Trivy (SARIF output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-source.sarif"
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-source.sarif"
        continue-on-error: true

  # ============================================
  # JOB 4: Build & Push Docker Images (Docker Hub)
  # ============================================
  # Both Dockerfiles are multi-stage with a distroless final stage (no shell, no package
  # manager, non-root) — `docker build` with no --target builds that last stage by
  # default, so this job's output is already the hardened production image; nothing
  # here needs to change for that.
  build-and-push:
    name: "📦 Build & Push Docker Images"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, trivy-source-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          load: true
          tags: ${{ env.DOCKER_BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: ${{ env.DOCKER_FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Trivy Image Scans ----
      - name: "🛡️ Trivy Scan Backend Image"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: "🛡️ Trivy Scan Frontend Image"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      # ---- Push Images ----
      - name: Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.DOCKER_BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_BACKEND_IMAGE }}:latest
          cache-from: type=gha

      - name: Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.DOCKER_FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_FRONTEND_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha

  # ============================================
  # JOB 5: Deploy to EKS
  # ============================================
  # Gated behind vars.EKS_DEPLOY_ENABLED == 'true' (unset/false by default) so this
  # intentionally no-ops — rather than hard-failing every push to main — until the new
  # AWS account exists, infra/terraform/ has actually been applied, and
  # AWS_DEPLOY_ROLE_ARN is set. Flip the var once that's done; no further workflow
  # changes needed.
  deploy:
    name: "🚀 Deploy to EKS"
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.EKS_DEPLOY_ENABLED == 'true'
    permissions:
      id-token: write
      contents: read
    outputs:
      site_ip: ${{ steps.ip.outputs.ip }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: Apply manifests (Ingress, ExternalSecret, StorageClass patches, etc.)
        run: kubectl apply -k k8s/eks/

      - name: Roll out new images
        run: |
          # `set image` matches containers BY NAME, and the backend Deployment has an
          # initContainer called "migrate" that also runs the backend image. Setting only
          # backend= leaves migrate on BACKEND_IMAGE_PLACEHOLDER, so the pod never gets
          # past Init:InvalidImageName and the rollout below times out. Both must be named.
          kubectl -n helpdesk set image deployment/backend \
            migrate=${{ env.DOCKER_BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            backend=${{ env.DOCKER_BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          kubectl -n helpdesk set image deployment/celery celery=${{ env.DOCKER_BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          kubectl -n helpdesk set image deployment/slack-bot slack-bot=${{ env.DOCKER_BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          kubectl -n helpdesk set image deployment/frontend frontend=${{ env.DOCKER_FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Wait for rollout
        run: |
          kubectl -n helpdesk rollout status deployment/backend --timeout=180s
          kubectl -n helpdesk rollout status deployment/frontend --timeout=180s
          kubectl -n helpdesk rollout status deployment/celery --timeout=180s
          kubectl -n helpdesk rollout status deployment/slack-bot --timeout=180s

      # The site address is a STATIC Elastic IP allocated by Terraform
      # (infra/terraform/static_ip.tf), not a load balancer hostname that has to be
      # waited for. It is looked up by tag rather than read from Terraform outputs so
      # this job needs no access to the state bucket — just ec2:DescribeAddresses,
      # granted in infra/terraform/github-oidc.tf.
      - name: Resolve static site IP
        id: ip
        run: |
          IP=$(aws ec2 describe-addresses \
            --filters "Name=tag:Role,Values=ingress-static-ip" \
            --query 'Addresses[0].PublicIp' --output text 2>/dev/null || echo "None")
          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "::error::No Elastic IP tagged Role=ingress-static-ip found. Has infra/terraform been applied?"
            exit 1
          fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Site IP: $IP"

  # ============================================
  # JOB 6: Health Check
  # ============================================
  health-check:
    name: "✅ Health Check"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: vars.EKS_DEPLOY_ENABLED == 'true'
    steps:
      - name: Check backend health via the static IP
        run: |
          SITE_IP="${{ needs.deploy.outputs.site_ip }}"
          if [ -z "$SITE_IP" ]; then
            echo "::error::No site IP returned by the deploy job"
            exit 1
          fi
          for i in $(seq 1 10); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "http://$SITE_IP/api/health/" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Backend health check failed"
          exit 1

  # ============================================
  # JOB 7: Notifications (Email + Slack)
  # ============================================
  notify:
    name: "📣 Notify"
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    if: always() && vars.EKS_DEPLOY_ENABLED == 'true'
    # The `secrets` context isn't available in step `if:` conditions (only in
    # `with`/`env`) — mirror it into `env` here so the Slack steps below can check
    # whether it's actually set via `env.SLACK_WEBHOOK_URL != ''`.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send success email
        if: needs.health-check.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Helpdesk Deployed — ${{ github.sha }}"
          body: |
            Mindstorm Helpdesk deployment successful!

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            By: ${{ github.actor }}

            App: http://${{ needs.deploy.outputs.site_ip }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "Helpdesk CI/CD <${{ secrets.EMAIL_USERNAME }}>"

      - name: Send failure email
        if: needs.health-check.result == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Helpdesk Deploy FAILED — ${{ github.sha }}"
          body: |
            Deployment failed!

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            By: ${{ github.actor }}

            Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "Helpdesk CI/CD <${{ secrets.EMAIL_USERNAME }}>"

      - name: Slack notify - deploy success
        if: needs.health-check.result == 'success' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":white_check_mark: *Helpdesk deployed* — <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}> on `${{ github.ref_name }}` by ${{ github.actor }}\nApp: http://${{ needs.deploy.outputs.site_ip }}"
            }

      - name: Slack notify - deploy failure
        if: needs.health-check.result == 'failure' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *Helpdesk deploy FAILED* — <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|run ${{ github.run_id }}> on `${{ github.ref_name }}` by ${{ github.actor }}"
            }

  # ============================================
  # JOB 8: Notify PR pipeline result (Slack)
  # ============================================
  # Runs on every PR regardless of EKS_DEPLOY_ENABLED — deploy/health-check/notify only
  # ever run on a push to main, so without this, a PR's test/Sonar/Trivy failures would
  # otherwise notify nobody.
  notify-pr:
    name: "💬 Notify PR Pipeline Result"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, trivy-source-scan]
    if: always() && github.event_name == 'pull_request'
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Slack notify - PR pipeline result
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ contains(needs.*.result, 'failure') && ':x: PR checks failed' || ':white_check_mark: PR checks passed' }} — <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}> by ${{ github.actor }}"
            }
