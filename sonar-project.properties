# sonar.projectKey/organization below are placeholders for LOCAL sonar-scanner runs only.
# The GitHub Actions pipeline overrides both via secrets.SONAR_PROJECT_KEY /
# secrets.SONAR_ORGANIZATION (see .github/workflows/cicd.yml) and is unaffected by this file.
# Replace the values below with your real SonarCloud project key/org slug
# (SonarCloud dashboard -> Administration -> Organization) before running sonar-scanner locally.
sonar.projectKey=mindstorm-helpdesk
sonar.organization=your-sonarcloud-org
sonar.projectName=Mindstorm Helpdesk

sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/migrations/**,**/*.min.js,**/staticfiles/**

sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
